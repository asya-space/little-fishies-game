<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>🐟 Aquarium game</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/main.css">
    </head>
    <body>
        <main>
            <div class="bg-bubbles"></div>

            <div class="game-container">
                <div class="score">
                    <div>
                        <div class="score__label">Caught</div>
                        <div class="score__value caught">0</div>
                    </div>
                    <div class="score__divider"></div>
                    <div>
                        <div class="score__label">Fish left</div>
                        <div class="score__value remaining">0</div>
                    </div>
                    <div class="score__divider"></div>
                    <div>
                        <div class="score__label">Time</div>
                        <div class="score__value timer">0:00</div>
                    </div>
                </div>

                <div class="aqua">
                    <div class="aqua__light-rays"></div>
                    <div class="aqua__soda"></div>
                    <div class="aqua__sand"></div>
                </div>
            </div>

            <div class="victory">
                <div class="victory__card">
                    <div class="victory__trophy">
                        <img src="assets/img/trophy-img.svg" alt="trophy">
                    </div>
                    <h2 class="victory__title">Congratulations</h2>
                    <p class="victory__desc">You caught all the fish<br>Excellent fishing!</p>
                    <div class="stats">
                        <div class="stats__table">
                            <div class="stats__num final-score">0</div>
                            <div class="stats__title">Fish</div>
                        </div>
                        <div class="stats__time">
                            <div class="stats__num final-time">0:00</div>
                            <div class="stats__title">Time</div>
                        </div>
                    </div>
                    <button class="restart-btn">&#8634; Play again</button>
                </div>
            </div>
        </main>
        <script src="js/main.js"></script>
    </body>
</html>
