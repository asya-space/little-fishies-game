<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>🐟 Aquarium game</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="accets/css/main.css">
    </head>
    <body>
        <main>
            <div class="bg-bubbles" id="bg-bubbles"></div>

            <div id="game-container">
                <div id="score-panel">
                    <div>
                        <div class="label">Caught</div>
                        <div class="value caught" id="caught-count">0</div>
                    </div>
                    <div class="divider"></div>
                    <div>
                        <div class="label">Fish left</div>
                        <div class="value remaining" id="remaining-count">0</div>
                    </div>
                    <div class="divider"></div>
                    <div>
                        <div class="label">Time</div>
                        <div class="value" id="timer">0:00</div>
                    </div>
                </div>

                <div id="aquarium">
                    <div class="light-rays"></div>
                    <div class="caustics"></div>
                    <div class="sand"></div>
                </div>
            </div>

            <div id="victory-screen">
                <div id="victory-card">
                    <div class="trophy">🏆</div>
                    <h2>Congratulations</h2>
                    <p>You caught all the fish<br>Excellent fishing!</p>
                    <div class="stats">
                        <div class="stat">
                            <div class="num" id="final-score">0</div>
                            <div class="lbl">Fish</div>
                        </div>
                        <div class="stat">
                            <div class="num" id="final-time">0:00</div>
                            <div class="lbl">Time</div>
                        </div>
                    </div>
                    <button id="restart-btn">🔄 Play again</button>
                </div>
            </div>
        </main>
    </body>
</html>
